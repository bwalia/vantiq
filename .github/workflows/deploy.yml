name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GitHub Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled, so
# a half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A custom domain serves from the root; a project page serves from /<repo>.
      # Getting this wrong breaks every asset URL, so the domain is read from the
      # Pages API rather than assumed — the repo's own settings are the source of
      # truth, and nobody has to remember to set a variable to match them.
      #
      # Worked out in bash rather than a `${{ a && b || c }}` expression: GitHub
      # treats an empty string as falsy, so that idiom silently falls through to
      # the default in exactly the custom-domain case where the value is "".
      - name: Resolve deploy URL and base path
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN_OVERRIDE: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          domain="$DOMAIN_OVERRIDE"
          if [ -z "$domain" ]; then
            domain=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)
          fi

          if [ -n "$domain" ]; then
            echo "Custom domain: $domain (serving from root)"
            echo "PAGES_DOMAIN=$domain" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$domain" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "PAGES_DOMAIN=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
          # Where the enquiry funnel posts. Pages cannot run the built-in Route
          # Handler, so this needs to be an external form service that accepts a
          # JSON POST. Left unset it becomes "-", which makes the form open a
          # pre-filled email rather than silently losing the enquiry.
          NEXT_PUBLIC_ENQUIRY_ENDPOINT: ${{ vars.ENQUIRY_ENDPOINT || '-' }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run build

      # Without this, Pages runs the upload through Jekyll, which drops _next/.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # An Actions deploy replaces the whole site, so the CNAME has to be part of
      # the artifact or the custom domain setting is dropped on publish.
      - name: Write CNAME for custom domain
        if: env.PAGES_DOMAIN != ''
        run: echo "$PAGES_DOMAIN" > out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
